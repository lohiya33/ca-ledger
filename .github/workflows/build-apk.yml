name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web bundle (www)
        run: npm run prepare-www

      - name: Install Capacitor dependencies
        run: npm install --no-package-lock

      - name: Add Android platform
        run: npx cap add android

      - name: Apply CA Final Study Ledger launcher icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 - << 'EOF'
          import os, shutil
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          src = 'icons/icon-512.png' if os.path.exists('icons/icon-512.png') else 'icons/icon-192.png'
          try:
              from PIL import Image
              img = Image.open(src).convert('RGBA')
              for folder, px in sizes.items():
                  out_dir = os.path.join('android/app/src/main/res', folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((px, px), Image.Resampling.LANCZOS)
                  for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                      resized.save(os.path.join(out_dir, name))
          except Exception:
              for folder in sizes:
                  out_dir = os.path.join('android/app/src/main/res', folder)
                  os.makedirs(out_dir, exist_ok=True)
                  for name in ('ic_launcher.png', 'ic_launcher_round.png'):
                      shutil.copyfile('icons/icon-192.png', os.path.join(out_dir, name))
          EOF

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CA-Final-Study-Ledger.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CA-Final-Study-Ledger-APK
          path: CA-Final-Study-Ledger.apk
          retention-days: 90
